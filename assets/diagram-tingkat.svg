<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 800; }
      .desc { font-family: system-ui, sans-serif; font-size: 11px; fill: #475569; }
      .badge { font-family: system-ui, sans-serif; font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <rect width="650" height="360" rx="16" fill="#f8fafc"/>

  <!-- Flow Arrows connecting the 3 levels -->
  <path d="M210,180 L235,180" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="240,180 232,175 232,185" fill="#64748b"/>

  <path d="M430,180 L455,180" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="460,180 452,175 452,185" fill="#64748b"/>

  <!-- Card 1: Tingkat Gen -->
  <g transform="translate(15, 20)">
    <rect width="200" height="320" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <rect width="200" height="46" rx="10" fill="#0284c7"/>
    <text x="100" y="28" class="title" fill="#ffffff" text-anchor="middle">1. TINGKAT GEN</text>

    <!-- Visual Icon Box -->
    <rect x="25" y="60" width="150" height="90" rx="8" fill="#f0f9ff"/>
    <!-- DNA Spiral / Variety graphic -->
    <circle cx="65" cy="105" r="22" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <text x="65" y="109" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">Mangga A</text>
    <circle cx="135" cy="105" r="22" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="135" y="109" font-family="sans-serif" font-size="11" font-weight="bold" fill="#854d0e" text-anchor="middle">Mangga B</text>

    <rect x="20" y="160" width="160" height="22" rx="4" fill="#e0f2fe"/>
    <text x="100" y="175" class="badge" fill="#0369a1" text-anchor="middle">SATU SPESIES SAMA</text>

    <text x="20" y="205" class="desc" font-weight="bold">Variasi susunan genetik</text>
    <text x="20" y="222" class="desc">• Varietas Mangga</text>
    <text x="20" y="238" class="desc">• Varietas Bibit Padi</text>
    <text x="20" y="254" class="desc">• Warna bulu kucing</text>
    <text x="20" y="280" class="desc" fill="#0284c7" font-weight="600">✓ Bisa kawin subur</text>
  </g>

  <!-- Card 2: Tingkat Jenis (Spesies) -->
  <g transform="translate(235, 20)">
    <rect width="200" height="320" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <rect width="200" height="46" rx="10" fill="#15803d"/>
    <text x="100" y="28" class="title" fill="#ffffff" text-anchor="middle">2. TINGKAT JENIS</text>

    <!-- Visual Icon Box -->
    <rect x="25" y="60" width="150" height="90" rx="8" fill="#f0fdf4"/>
    <ellipse cx="65" cy="105" rx="26" ry="18" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="65" y="109" font-family="sans-serif" font-size="10" font-weight="bold" fill="#9a3412" text-anchor="middle">Harimau</text>
    <ellipse cx="135" cy="105" rx="22" ry="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="135" y="109" font-family="sans-serif" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">Kucing</text>

    <rect x="20" y="160" width="160" height="22" rx="4" fill="#dcfce7"/>
    <text x="100" y="175" class="badge" fill="#15803d" text-anchor="middle">ANTARSPESIES BERBEDA</text>

    <text x="20" y="205" class="desc" font-weight="bold">Perbedaan spesies nyata</text>
    <text x="20" y="222" class="desc">• Famili Felidae (Kucing)</text>
    <text x="20" y="238" class="desc">• Kelapa, Pinang, Aren</text>
    <text x="20" y="254" class="desc">• Kacang hijau, kedelai</text>
    <text x="20" y="280" class="desc" fill="#15803d" font-weight="600">✗ Tidak kawin silang subur</text>
  </g>

  <!-- Card 3: Tingkat Ekosistem -->
  <g transform="translate(455, 20)">
    <rect width="180" height="320" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="2.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <rect width="180" height="46" rx="10" fill="#c2410c"/>
    <text x="90" y="28" class="title" fill="#ffffff" text-anchor="middle">3. EKOSISTEM</text>

    <!-- Visual Icon Box -->
    <rect x="15" y="60" width="150" height="90" rx="8" fill="#fff7ed"/>
    <!-- Mountain and Coral mini silhouette -->
    <polygon points="30,135 60,85 90,135" fill="#047857"/>
    <path d="M100,135 Q125,95 150,135 Z" fill="#0284c7"/>
    <text x="90" y="100" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Biotik + Abiotik</text>

    <rect x="15" y="160" width="150" height="22" rx="4" fill="#ffedd5"/>
    <text x="90" y="175" class="badge" fill="#c2410c" text-anchor="middle">KOMUNITAS &amp; BENTANG ALAM</text>

    <text x="15" y="205" class="desc" font-weight="bold">Interaksi lingkungan hidup</text>
    <text x="15" y="222" class="desc">• Terumbu Karang laut</text>
    <text x="15" y="238" class="desc">• Hutan Hujan Tropis</text>
    <text x="15" y="254" class="desc">• Hutan Mangrove pantai</text>
    <text x="15" y="280" class="desc" fill="#c2410c" font-weight="600">✓ Jaring-jaring makanan</text>
  </g>
</svg>

