<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <defs>
    <!-- Icon Mangga -->
    <g id="icon-mangga">
      <path d="M40,20 Q60,10 70,30 Q85,55 75,80 Q65,100 45,95 Q20,90 20,60 Q20,30 40,20 Z" fill="#f59e0b"/>
      <path d="M40,20 Q45,5 50,2" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M50,6 Q65,0 70,12 Q60,18 50,6 Z" fill="#16a34a"/>
    </g>

    <!-- Icon Harimau -->
    <g id="icon-harimau">
      <circle cx="50" cy="50" r="35" fill="#f97316"/>
      <!-- Ears -->
      <polygon points="25,25 20,5 40,18" fill="#ea580c"/>
      <polygon points="75,25 80,5 60,18" fill="#ea580c"/>
      <!-- Stripes -->
      <path d="M50,20 L50,35 M30,45 L42,48 M70,45 L58,48 M35,65 L45,63 M65,65 L55,63" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
      <!-- Eyes & Nose -->
      <circle cx="38" cy="45" r="4" fill="#000000"/>
      <circle cx="62" cy="45" r="4" fill="#000000"/>
      <polygon points="50,55 45,62 55,62" fill="#000000"/>
    </g>

    <!-- Icon Terumbu Karang -->
    <g id="icon-karang">
      <path d="M25,85 Q20,55 35,50 Q45,45 42,30 Q50,25 55,40 Q65,20 75,30 Q70,50 80,60 Q85,75 75,85 Z" fill="#ec4899"/>
      <circle cx="35" cy="65" r="3" fill="#be185d"/>
      <circle cx="55" cy="55" r="3" fill="#be185d"/>
      <circle cx="65" cy="70" r="3" fill="#be185d"/>
    </g>

    <!-- Icon Anoa -->
    <g id="icon-anoa">
      <ellipse cx="50" cy="55" rx="35" ry="25" fill="#334155"/>
      <!-- Horns pointing backwards -->
      <path d="M38,35 Q30,10 22,5" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M62,35 Q70,10 78,5" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="36" cy="48" r="3.5" fill="#ffffff"/>
      <circle cx="64" cy="48" r="3.5" fill="#ffffff"/>
      <ellipse cx="50" cy="65" rx="12" ry="7" fill="#1e293b"/>
    </g>

    <!-- Icon Cenderawasih -->
    <g id="icon-cenderawasih">
      <!-- Body & Plumes -->
      <path d="M20,60 Q40,30 65,40 Q85,35 90,50 Q75,70 50,65 Z" fill="#eab308"/>
      <!-- Emerald throat -->
      <circle cx="70" cy="42" r="8" fill="#10b981"/>
      <path d="M85,40 L95,38 L88,46 Z" fill="#f97316"/>
      <!-- Elaborate tail wires -->
      <path d="M25,62 Q-10,80 -15,110 Q-5,85 20,70" stroke="#f59e0b" stroke-width="3" fill="none"/>
      <path d="M20,65 Q-20,95 -10,120 Q5,95 25,75" stroke="#ef4444" stroke-width="2.5" fill="none"/>
    </g>

    <!-- Icon Komodo -->
    <g id="icon-komodo">
      <path d="M15,65 Q35,45 65,50 Q85,45 95,55 Q75,70 45,70 Z" fill="#78716c"/>
      <path d="M92,54 Q105,52 110,48" stroke="#ef4444" stroke-width="2" fill="none"/>
      <circle cx="78" cy="50" r="2.5" fill="#000000"/>
    </g>
  </defs>
</svg>

